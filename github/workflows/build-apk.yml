name: Gerar APK Agenda Personal

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          mkdir -p projeto_android
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*AndroidStudio*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Arquivo ZIP do Android não encontrado."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d projeto_android

          PROJECT_DIR=$(dirname "$(find projeto_android -name settings.gradle | head -n 1)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Android não encontrado dentro do ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Personal-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

<script>
'use strict';
const Q = new URLSearchParams(location.search);
const APP = Q.get('app') || 'prof-285.html';
const MODE = Q.get('mode') || 'func';          // func (regressão do 1.12.284) | excl (cadastros excluídos, 1.12.285) | shot

const TEACHER = 'R2EmnDVcvMWt7TjPxOP6DjW1VOn1';
const log = (kind, name, extra) => console.log('AUDIT ' + kind + ' ' + name + (extra ? ' | ' + extra : ''));
let ok = 0, bad = 0;
const check = (name, cond, extra) => { if (cond) { ok++; log('OK', name); } else { bad++; log('FALHA', name, extra); } };
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 9000, step = 40) { const t0 = Date.now(); for (;;) { let v; try { v = fn(); } catch (e) { v = null; } if (v) return v; if (Date.now() - t0 > ms) return null; await sleep(step); } }

// ---------- Firestore simulado ----------
const docs = new Map();
function seedDocs() {
  docs.clear();
  const base = {perfil: 'aluno', professorId: TEACHER, nascimento: '2000-05-12', genero: 'Prefiro não informar'};
  const add = (id, nome, ativo, extra = {}) => docs.set(id, {...base, nome, email: nome.split(' ')[0].toLowerCase() + '@exemplo.com', whatsapp: '(69) 99999-' + String(1000 + docs.size), ativo, ...extra});
  add('u_ana', 'Ana Pendente', false);
  add('u_bruno', 'Bruno Aguardando', false);
  add('u_carla', 'Carla Aprovada', true);                 // aprovada, mas ainda não está na agenda
  add('u_diego', 'Diego Na Agenda', true);                // já está na agenda
  add('u_elisa', 'Elisa Na Agenda Sem Aprovar', false);   // está na agenda, ativo=false no Firebase
  add('u_outro', 'Fabio De Outro Professor', false, {professorId: 'OUTRO'});
}
const calls = {updateDoc: [], getDocs: 0, other: []};
const liveListeners = new Set();
const sdk = {
  auth: {currentUser: {uid: TEACHER, getIdToken: async () => 'token'}},
  db: {},
  collection: (db, name) => ({name}),
  where: (field, op, val) => ({field, op, val}),
  query: (col, ...cons) => ({col, cons}),
  getDocs: async q => { calls.getDocs++; await sleep(25); return {docs: [...docs.entries()].filter(([id, d]) => q.cons.every(c => c.op === '==' ? d[c.field] === c.val : true)).map(([id, d]) => ({id, data: () => ({...d})}))}; },
  onSnapshot: (q, onNext) => {
    const run = () => onNext({docs: [...docs.entries()].filter(([id, d]) => q.cons.every(c => c.op === '==' ? d[c.field] === c.val : true)).map(([id, d]) => ({id, data: () => ({...d})}))});
    liveListeners.add(run); setTimeout(run, 0); return () => liveListeners.delete(run);
  },
  doc: (db, col, uid) => ({col, uid}),
  updateDoc: async (ref, ...fields) => {
    const data = {}; for (let i = 0; i < fields.length; i += 2) data[fields[i]] = fields[i + 1];
    calls.updateDoc.push({uid: ref.uid, data}); await sleep(25);
    docs.set(ref.uid, {...docs.get(ref.uid), ...data});
    liveListeners.forEach(fn => fn());
  },
  serverTimestamp: () => 'server-time',
  onAuthStateChanged: (auth, cb) => { setTimeout(() => cb(auth.currentUser), 0); return () => {}; },
  signInWithEmailAndPassword: async () => { throw {code: 'auth/invalid-credential'}; },
  signOut: async () => { sdk.auth.currentUser = null; }
};
window.APaccounts = {registrationSdk: async () => sdk, isTeacher: () => true, teacherUid: () => TEACHER, logout() {}, retry() {}};

// ---------- helpers do aplicativo ----------
let W, D;
const $ = (sel, root = D) => root.querySelector(sel);
const $$ = (sel, root = D) => [...root.querySelectorAll(sel)];
const visible = el => !!el && !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length) && getComputedStyle(el).visibility !== 'hidden';
const text = el => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');
async function boot() {
  if (THEME === 'metal') localStorage.setItem('agendaPersonalTL_design_v1', JSON.stringify({version: 1, id: 'metal-tl'}));
  if (THEME === 'deep') localStorage.setItem('agendaPersonalTL_design_v1', JSON.stringify({version: 1, id: 'deep-tl'}));
  seedDocs();
  const frame = document.getElementById('app');
  frame.src = APP;
  await new Promise(r => frame.addEventListener('load', r, {once: true}));
  W = frame.contentWindow; D = W.document;
  await until(() => typeof W.openRegistrationLink === 'function' && $('[data-screen="more"]'), 15000);
  // alunos que já estão na agenda (firebaseUid igual ao cadastro)
  if (SEED !== 'none') {
    const mk = (id, name, uid) => ({id, name, phone: '55699999' + id.slice(-4).padStart(4, '0'), studentType: 'presencial', financeEnabled: false, firebaseUid: uid, createdAt: '2026-11-01'});
    W.eval("state.students.push(" + JSON.stringify(mk('stu_diego', 'Diego Na Agenda', 'u_diego')) + ", " + JSON.stringify(mk('stu_elisa', 'Elisa Na Agenda Sem Aprovar', 'u_elisa')) + ", " + JSON.stringify({id: 'stu_livre', name: 'Gil Sem Conta', phone: '5569999990099', studentType: 'online', financeEnabled: false, createdAt: '2026-11-02'}) + ")");
    if (SEED === 'allin') {
      W.eval("state.students.push(" + JSON.stringify(mk('stu_ana', 'Ana Pendente', 'u_ana')) + ", " + JSON.stringify(mk('stu_bruno', 'Bruno Aguardando', 'u_bruno')) + ", " + JSON.stringify(mk('stu_carla', 'Carla Aprovada', 'u_carla')) + ")");
    }
    try { W.eval('renderAll()'); } catch (e) { log('AVISO', 'renderAll', String(e)); }
  }
  if (HIDDEN !== 'none') {
    // Exclusões que já estavam guardadas na agenda, como as que o Excluir da lista do Contatos antigo deixou no celular.
    const key = id => TEACHER + ':' + id;
    const map = HIDDEN === 'all'
      ? Object.fromEntries(['u_ana', 'u_bruno', 'u_carla', 'u_diego', 'u_elisa'].map(id => [key(id), true]))
      : {[key('u_bruno')]: true, [key('u_carla')]: true, 'OUTRO:u_x': true, [key('u_ghost')]: true};
    W.eval('state.registrationContactsHidden = ' + JSON.stringify(map));
    const view = D.getElementById('registrationContactsView');   // o sininho recontar já com as exclusões guardadas (ele observa esta área)
    if (view) { const mark = D.createElement('i'); view.append(mark); mark.remove(); }
  }
  await sleep(THEME ? 1800 : 500);
}
const goMais = async () => { await tap($('[data-screen="more"]')); await until(() => visible($('#moreRegistrationLink')), 6000); await sleep(THEME ? 1400 : 900); };
const dialog = () => $('#registrationLinkDialog');
const isOpen = () => dialog().classList.contains('open');
const cards = () => $$('#registrationContactsList [data-registration-uid]');
const names = () => cards().map(c => text($('strong', c)));
const statusOf = c => text($('.registration-contact-status', c));
const removeButtons = () => $$('#registrationContactsList [data-registration-remove]');
const waitList = async (count) => until(() => $('#registrationContactsList') && !$('#registrationContactsList').textContent.includes('Buscando') && (count === undefined ? $('#registrationContactsList').children.length : cards().length === count), 6000);
const fire = (el, type) => el.dispatchEvent(new W.Event(type, {bubbles: true}));
async function tap(el) {
  if (!el) throw new Error('tap em elemento inexistente');
  el.scrollIntoView({block: 'center'});
  let last = '';
  for (let k = 0; k < 40; k++) { await sleep(60); const q = el.getBoundingClientRect(); const now = [q.x, q.y, q.width, q.height].map(Math.round).join(','); if (now === last) break; last = now; }
  const r = el.getBoundingClientRect();
  const x = Math.round(r.x + r.width / 2), y = Math.round(r.y + r.height / 2);
  const top = D.elementFromPoint(x, y) || el;
  const o = {bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1, pointerType: 'touch', isPrimary: true, view: W};
  let seen = [];
  const spy = e => seen.push(e.type + (e.defaultPrevented ? '!' : ''));
  for (const t of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) D.addEventListener(t, spy, true);
  for (const [T, t] of [[W.PointerEvent, 'pointerdown'], [W.MouseEvent, 'mousedown'], [W.PointerEvent, 'pointerup'], [W.MouseEvent, 'mouseup'], [W.MouseEvent, 'click']]) top.dispatchEvent(new T(t, o));
  for (const t of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) D.removeEventListener(t, spy, true);
  if (Q.get('tapdebug')) log('TAP', (el.id || el.className || el.tagName) + ' -> ' + top.tagName + '#' + top.id + '.' + String(top.className).slice(0, 30), 'xy=' + x + ',' + y + ' eventos=' + seen.join(','));
  return top;
}
async function tapCard(el) {
  await tap(el); await sleep(150);
  if (!isOpen()) { await tap(el); await sleep(150); }
}
const byName = n => cards().find(c => text($('strong', c)) === n);

async function openBellCard() {
  if (!visible($('.registration-notification-card'))) { await tap($('.header-notifications')); await until(() => visible($('.registration-notification-card')), 4000); }
  return $('.registration-notification-card');
}
async function openApprovals() { await tapCard($('#moreStudentApprovals')); await until(isOpen, 4000); await waitList(); await sleep(150); }
async function openList() { await tapCard($('#moreStudentList')); await until(isOpen, 4000); await waitList(); await sleep(150); }
async function closeWindow() { W.closeDialog('registrationLinkDialog'); await sleep(200); }
async function exclude(name) {
  const card = byName(name);
  if (!card) return false;
  await tap($('[data-registration-remove]', card)); await sleep(150);
  const confirm = $('[data-registration-remove-confirm]');
  if (!confirm) return false;
  await tap(confirm); await sleep(250);
  return !byName(name);
}

// o que cada janela mostra (título, ícones, atalhos, botão fechar)
const windowState = () => ({
  title: text($('#registrationLinkTitle')),
  tabs: visible($('#registrationTabs')),
  link: visible($('#registrationLinkIcon')),
  approvals: visible($('#registrationApprovalsIcon')),
  roster: visible($('#registrationRosterIcon')),
  close: $('#registrationLinkClose').getAttribute('aria-label')
});
const sameWindow = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const APPROVALS_WINDOW = {title: 'Alunos para aprovar', tabs: false, link: false, approvals: true, roster: false, close: 'Fechar alunos para aprovar'};
const LIST_WINDOW = {title: 'Lista de alunos', tabs: false, link: false, approvals: false, roster: true, close: 'Fechar lista de alunos'};
const LINKS_WINDOW = {title: 'Cadastro por link', tabs: true, link: true, approvals: false, roster: false, close: 'Fechar cadastro por link'};

// ---------- 1.12.285: cadastros excluídos da lista (bloco "Mostrar excluídos" da Lista de alunos) ----------
const NAMES_ALL = ['Ana Pendente', 'Bruno Aguardando', 'Carla Aprovada', 'Diego Na Agenda', 'Elisa Na Agenda Sem Aprovar'];
const hiddenBlock = () => $('#registrationContactsList .registration-hidden');
const hiddenCards = () => $$('#registrationContactsList .registration-contact-hidden');
const hiddenNames = () => hiddenCards().map(c => text($('strong', c)));
const toggle = () => $('#registrationContactsList [data-registration-hidden-toggle]');
const restoreButtons = () => $$('#registrationContactsList [data-registration-restore]');
const restoreAll = () => $('#registrationContactsList [data-registration-restore-all]');
const hiddenMap = () => JSON.parse(W.eval('JSON.stringify(state.registrationContactsHidden || {})'));
const savedMap = () => { try { return JSON.parse(W.localStorage.getItem(W.eval('DB_KEY'))).registrationContactsHidden || {}; } catch (e) { return null; } };
const keysOf = m => Object.keys(m || {}).sort();
const statusMsg = () => text($('#registrationStatus'));
const bellCount = () => { const b = $('.registration-notification-count'); return !b || b.hidden ? 0 : Number(text(b)); };
let syncCalls = 0;
function watchSync() { const real = W.APTeacherSync; W.APTeacherSync = {...real, changed: (...a) => { syncCalls++; return real.changed(...a); }}; }
const failStorage = () => { const real = W.Storage.prototype.setItem, key = W.eval('DB_KEY'); W.Storage.prototype.setItem = function (k, v) { if (k === key) throw new W.Error('armazenamento cheio (simulado)'); return real.call(this, k, v); }; return () => { W.Storage.prototype.setItem = real; }; };
const tapAndCount = async el => { const s0 = syncCalls; await tap(el); await sleep(450); return syncCalls - s0; };

async function allHidden() {
  // O estado que o celular do Tiago tinha em 19/11: o Firebase devolve os cadastros e todos estão marcados como excluídos da lista.
  check('sininho: ninguém aguardando, porque todos os cadastros estão excluídos da lista', bellCount() === 0, 'contador=' + bellCount());
  await goMais(); await openList();
  check('abre a Lista de alunos', isOpen() && sameWindow(windowState(), LIST_WINDOW), JSON.stringify(windowState()));
  check('sem aluno visível: nenhum cartão e a mensagem "Nenhum aluno na lista."', cards().length === 0 && /Nenhum aluno na lista\./.test(text($('#registrationContactsList .registration-empty'))), text($('#registrationContactsList')).slice(0, 100));
  const b = hiddenBlock();
  check('o bloco dos excluídos já vem aberto, sem botão Mostrar, com os 5 cadastros', visible(b) && hiddenCards().length === 5 && !toggle(), b && text(b).slice(0, 100));
  check('o texto diz quantos são e que nada foi apagado', /5 cadastros excluídos da lista\./.test(text(b)) && /Nada foi apagado: a conta e os dados do aluno continuam guardados\./.test(text(b)), text(b).slice(0, 160));
  check('os cinco aparecem em ordem de nome', hiddenNames().join('|') === NAMES_ALL.join('|'), hiddenNames().join('|'));
  check('cada um mostra a situação certa', hiddenCards().map(statusOf).join('|') === 'Aguardando aprovação|Aguardando aprovação|Aprovado · adicionar à agenda|Na agenda|Na agenda', hiddenCards().map(statusOf).join('|'));
  check('cada um mostra e-mail e telefone', hiddenCards().every(c => /@exemplo\.com/.test(text(c)) && /\(69\) 99999-/.test(text(c))));
  check('o cadastro de outro professor não aparece', !/Fabio/.test(text(dialog())));
  check('cada um tem Voltar para a lista (com o nome no rótulo) e há Voltar todos para a lista', restoreButtons().length === 5 && restoreButtons().every(btn => text(btn) === 'Voltar para a lista' && /^Voltar .+ para a lista$/.test(btn.getAttribute('aria-label'))) && !!restoreAll() && text(restoreAll()) === 'Voltar todos para a lista', restoreButtons().length + ' ' + (restoreAll() && text(restoreAll())));
  check('os cartões escondidos não têm aprovar, tipo de aluno nem excluir', $$('#registrationContactsList [data-registration-approve], #registrationContactsList select, #registrationContactsList [data-registration-remove], #registrationContactsList [data-registration-edit]').length === 0);
  const boxes = [restoreAll(), ...restoreButtons()].map(btn => btn.getBoundingClientRect());
  check('botões do bloco com 44 px de altura e largura quase total da janela', boxes.every(r => r.height >= 43.5 && r.width >= 200), boxes.map(r => Math.round(r.width) + 'x' + Math.round(r.height)).join(' '));
  check('abrir a lista não grava nada no Firebase nem muda as exclusões', calls.updateDoc.length === 0 && keysOf(hiddenMap()).length === 5);
  await closeWindow();

  // Alunos para aprovar não mostra excluídos
  await openApprovals();
  check('Alunos para aprovar continua vazio e sem o bloco dos excluídos', sameWindow(windowState(), APPROVALS_WINDOW) && cards().length === 0 && /Nenhum aluno aguardando aprovação\./.test(text($('#registrationContactsList'))) && !hiddenBlock() && !toggle() && restoreButtons().length === 0, text($('#registrationContactsList')));
  await closeWindow();

  // devolver um cadastro que aguarda aprovação
  await goMais(); await openList();
  const bruno = hiddenCards().find(c => text($('strong', c)) === 'Bruno Aguardando');
  const d1 = await tapAndCount($('[data-registration-restore]', bruno));
  const cb = byName('Bruno Aguardando');
  check('Bruno volta para a lista aguardando aprovação, com os botões de aprovar e de excluir', names().join('|') === 'Bruno Aguardando' && cb && statusOf(cb) === 'Aguardando aprovação' && !!$('[data-registration-approve]', cb) && !!$('[data-registration-remove]', cb), names().join('|'));
  check('o bloco continua aberto com os outros 4 e o botão Ocultar excluídos', hiddenNames().join('|') === 'Ana Pendente|Carla Aprovada|Diego Na Agenda|Elisa Na Agenda Sem Aprovar' && toggle() && text(toggle()) === 'Ocultar excluídos' && toggle().getAttribute('aria-expanded') === 'true', hiddenNames().join('|'));
  check('mensagem de confirmação, sem erro', statusMsg() === 'Cadastro devolvido à lista.' && $('#registrationStatus').dataset.error === 'false', statusMsg());
  check('a marca de Bruno sai da agenda e do armazenamento; as outras 4 ficam', !hiddenMap()[TEACHER + ':u_bruno'] && keysOf(hiddenMap()).length === 4 && keysOf(savedMap()).length === 4 && !savedMap()[TEACHER + ':u_bruno'], JSON.stringify(keysOf(hiddenMap())) + ' / ' + JSON.stringify(keysOf(savedMap())));
  check('a agenda é avisada para sincronizar, uma vez', d1 === 1, 'avisos=' + d1);
  check('nada gravado no cadastro do aluno no Firebase', calls.updateDoc.length === 0 && docs.get('u_bruno').ativo === false);
  check('sininho passa a contar Bruno (1)', bellCount() === 1, 'contador=' + bellCount());

  // fechar e abrir o bloco
  await tap(toggle()); await sleep(250);
  check('Ocultar excluídos some com a relação e vira Mostrar excluídos (4)', hiddenCards().length === 0 && text(toggle()) === 'Mostrar excluídos (4)' && toggle().getAttribute('aria-expanded') === 'false', toggle() && text(toggle()));
  await tap(toggle()); await sleep(250);
  check('Mostrar excluídos abre de novo com os 4', hiddenCards().length === 4 && text(toggle()) === 'Ocultar excluídos', hiddenNames().join('|'));

  // devolver um aprovado que ainda não está na agenda
  const carla = hiddenCards().find(c => text($('strong', c)) === 'Carla Aprovada');
  const d2 = await tapAndCount($('[data-registration-restore]', carla));
  const cc = byName('Carla Aprovada');
  check('Carla volta como Aprovado · adicionar à agenda, com o botão Adicionar à agenda', cc && statusOf(cc) === 'Aprovado · adicionar à agenda' && text($('[data-registration-approve]', cc)) === 'Adicionar à agenda', cc && statusOf(cc));
  check('na lista os que aguardam vêm primeiro', names().join('|') === 'Bruno Aguardando|Carla Aprovada', names().join('|'));
  check('um aviso de sincronização por devolução', d2 === 1, 'avisos=' + d2);

  // devolver todos os que sobraram
  const d3 = await tapAndCount(restoreAll());
  check('Voltar todos devolve os 3 que sobraram: cinco cartões na lista e o bloco some', cards().length === 5 && !hiddenBlock(), names().join('|'));
  check('mensagem: 3 cadastros devolvidos à lista.', statusMsg() === '3 cadastros devolvidos à lista.' && $('#registrationStatus').dataset.error === 'false', statusMsg());
  check('nenhuma exclusão sobra, nem na agenda nem no armazenamento', keysOf(hiddenMap()).length === 0 && keysOf(savedMap()).length === 0, JSON.stringify(hiddenMap()));
  check('um único aviso de sincronização para os três de uma vez', d3 === 1, 'avisos=' + d3);
  check('ainda nada gravado no Firebase', calls.updateDoc.length === 0);
  check('sininho volta a contar 3 (Ana, Bruno e Elisa)', bellCount() === 3, 'contador=' + bellCount());
  await closeWindow();

  // devolvidos, voltam também em Alunos para aprovar (só quem precisa de ação)
  await openApprovals();
  check('Alunos para aprovar volta a mostrar Ana, Bruno, Elisa e Carla (Diego já está aprovado e na agenda)', names().join('|') === 'Ana Pendente|Bruno Aguardando|Elisa Na Agenda Sem Aprovar|Carla Aprovada' && removeButtons().length === 0 && !hiddenBlock(), names().join('|'));

  await goMais(); await openList();

  const d4 = await tapAndCount($('[data-registration-remove-confirm]'));
  check('depois de excluir, o bloco aparece fechado com Mostrar excluídos (1)', !byName('Diego Na Agenda') && toggle() && text(toggle()) === 'Mostrar excluídos (1)' && hiddenCards().length === 0, toggle() && text(toggle()));
  check('a exclusão de Diego é guardada e avisa a agenda uma vez', hiddenMap()[TEACHER + ':u_diego'] === true && d4 === 1, 'avisos=' + d4);

  // Atualizar lista mantém o bloco aberto; abrir a lista de novo recomeça fechado
  await tap(toggle()); await sleep(250);
  await tap($('#registrationRefresh')); await waitList(); await sleep(350);
  check('Atualizar lista mantém o bloco aberto', hiddenNames().join('|') === 'Diego Na Agenda' && toggle() && text(toggle()) === 'Ocultar excluídos', hiddenNames().join('|'));
  await closeWindow(); await goMais(); await openList();
  check('abrir a lista de novo recomeça com o bloco fechado', hiddenCards().length === 0 && toggle() && text(toggle()) === 'Mostrar excluídos (1)', toggle() && text(toggle()));

  // não conseguir salvar: nada muda e a tela avisa
  await tap(toggle()); await sleep(250);
  const undoFail = failStorage();
  const d5 = await tapAndCount($('[data-registration-restore]'));
  undoFail();
  check('sem conseguir salvar, Diego continua excluído e a tela avisa com erro', !byName('Diego Na Agenda') && hiddenNames().join('|') === 'Diego Na Agenda' && /Não foi possível salvar\. Os cadastros continuam excluídos da lista\./.test(statusMsg()) && $('#registrationStatus').dataset.error === 'true', statusMsg());
  check('e a marca de Diego continua na agenda, sem aviso de sincronização', hiddenMap()[TEACHER + ':u_diego'] === true && d5 === 0, 'avisos=' + d5);
  const d6 = await tapAndCount($('[data-registration-restore]'));
  check('com o armazenamento de volta, Voltar para a lista funciona', !!byName('Diego Na Agenda') && !hiddenBlock() && !hiddenMap()[TEACHER + ':u_diego'] && d6 === 1, names().join('|') + ' avisos=' + d6);
  check('em todo o percurso, nenhuma gravação no cadastro dos alunos no Firebase', calls.updateDoc.length === 0, JSON.stringify(calls.updateDoc));
  await closeWindow();
}

async function someHidden() {
  // Bruno e Carla excluídos, mais duas marcas que não são de cadastros desta lista: a de outro professor e a de um cadastro que o Firebase não devolve.
  await goMais(); await openList();

async function shot() {
  await goMais();
  if (VIEW === 'mais') {
    const grp = $('[data-more-group="students"]'); grp && grp.scrollIntoView({block: 'start'}); await sleep(THEME ? 900 : 300);
  } else if (VIEW === 'cards') {
    const lista = $('#moreStudentList'); lista && lista.scrollIntoView({block: 'center'}); await sleep(THEME ? 900 : 300);
  } else if (VIEW === 'links') {
    await tapCard($('#moreRegistrationLink')); await until(isOpen, 4000); await sleep(THEME ? 1200 : 500);
  } else if (VIEW === 'approvals' || VIEW === 'empty') {
    await openApprovals(); await sleep(THEME ? 1200 : 400);
  } else if (VIEW === 'list' || VIEW === 'confirm') {
    await openList(); await sleep(THEME ? 1200 : 400);
    if (VIEW === 'confirm') {
      const c = byName('Elisa Na Agenda Sem Aprovar'); await tap($('[data-registration-remove]', c)); await sleep(400);
      const p = $('#registrationRemovalPrompt'); p && p.scrollIntoView({block: 'center'}); await sleep(300);
    }
  } else if (VIEW === 'excl-all' || VIEW === 'excl-closed' || VIEW === 'excl-open') {
    // excl-all: o estado do celular do Tiago (todos excluídos); excl-closed / excl-open: alguns excluídos, bloco fechado / aberto
    await openList(); await sleep(THEME ? 1200 : 400);
    if (VIEW === 'excl-open') { await tap(toggle()); await sleep(THEME ? 900 : 300); hiddenBlock().scrollIntoView({block: 'start'}); await sleep(THEME ? 900 : 300); }
    if (VIEW === 'excl-closed') { toggle().scrollIntoView({block: 'center'}); await sleep(THEME ? 900 : 300); }
  }
  log('SHOT', 'pronto ' + VIEW + ' ' + (THEME || 'padrão'));
}

(async () => {
  try {
    await boot();
    if (MODE === 'func') await functional(); else if (MODE === 'excl') await excluded(); else await shot();
  } catch (e) {
    log('EXCECAO', 'driver', (e && e.stack) || String(e));
    log('RESUMO', 'ok=' + ok + ' falhas=' + (bad + 1));
    log('SHOT', 'erro');
  }
})();

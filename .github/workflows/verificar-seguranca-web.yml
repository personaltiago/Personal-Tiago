name: Verificar segurança web
on:
  pull_request:
    paths:
      - 'web-app/**'
      - '.github/workflows/verificar-seguranca-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seguranca-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run validate
      - name: Segurança e fluxos preservados, com serviços sintéticos
        run: |
          set -euo pipefail
          for test in security login-session web-routes registration-notices teacher-agenda photos workouts feedback student-evolution workout-audio workout-audio-options updates hosted-release android-installer; do
            node "tests/$test.mjs"
          done

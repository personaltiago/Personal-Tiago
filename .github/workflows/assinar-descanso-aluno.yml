name: Assinar correção de descanso do aluno

on:
  push:
    branches: [main]
    paths: ['.github/workflows/assinar-descanso-aluno.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extrair as ferramentas de assinatura do projeto
        run: |
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'agenda-sign'
          directory.mkdir(mode=0o700)
          with zipfile.ZipFile('AgendaPersonal_AndroidStudio_v1.65_contas_convites.zip') as archive:
              for filename in ('sign_update.cjs', 'SignAgendaUpdate.java'):
                  member = next(n for n in archive.namelist() if n.endswith('/tools/' + filename))
                  (directory / filename).write_bytes(archive.read(member))
          PY

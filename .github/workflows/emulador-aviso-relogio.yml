name: Emulador — aviso no relógio (teste, sem publicar)

# Compila o ZIP oficial em modo de teste (chave de depuração do GitHub), liga um Android 14 de mentira e roda
# equipe/testes/emulador/AvisoRelogioSimulation.java: alarme, receptor, canal e notificação do aviso no relógio com a tela
# apagada, desmarcar, trocar, desligado, Testar no relógio, a ponte window.Android e sem "Alarmes e lembretes".
# Não usa a chave oficial, não cria Release, não envia arquivo nenhum e não grava no repositório. Não testa um relógio de verdade.
on:
  pull_request:
    paths:
      - 'AgendaPersonal_AndroidStudio_v1.65_contas_convites.zip'
      - '.github/workflows/emulador-aviso-relogio.yml'
      - 'equipe/testes/emulador/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulador-aviso-relogio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair o projeto e acrescentar a simulação (só nesta máquina)
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/agenda"; mkdir -p "$T"
          unzip -q AgendaPersonal_AndroidStudio_v1.65_contas_convites.zip -d "$T"
          P="$(dirname "$(find "$T" -name settings.gradle | head -1)")"
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
          D="$P/app/src/androidTest/java/com/tiagolima/agendapersonal"; mkdir -p "$D"
          cp equipe/testes/emulador/AvisoRelogioSimulation.java "$D/"
          cat >> "$P/app/build.gradle" <<'GRADLE'

          android { defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' } }
          dependencies {
              androidTestImplementation 'androidx.test:runner:1.6.2'
              androidTestImplementation 'androidx.test:core:1.6.1'
              androidTestImplementation 'androidx.test.ext:junit:1.2.1'
              androidTestImplementation 'junit:junit:4.13.2'
          }
          GRADLE
      - name: Compilar o app e a simulação (depuração, sem a chave oficial)
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          unset ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
          echo "APP_APK=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          echo "TEST_APK=$PROJECT_DIR/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" >> "$GITHUB_ENV"
      - name: Ativar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar a simulação no Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash equipe/testes/emulador/rodar-aviso-relogio.sh

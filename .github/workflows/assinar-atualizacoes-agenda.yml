name: Assinar atualizações do Agenda Personal

on:
  push:
    branches: [main]
    paths:
      - '*.agenda.json'
  workflow_dispatch:
    inputs:
      arquivo:
        description: Nome do arquivo .agenda.json na pasta principal do repositório
        required: true
        type: string

permissions:
  contents: read

jobs:
  assinar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Selecionar arquivos da atualização
        id: entrada
        env:
          BEFORE: ${{ github.event.before }}
          UPDATE_FILE: ${{ inputs.arquivo }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "$BEFORE^{commit}"; then
              git fetch --no-tags --depth=1 origin "$BEFORE"
            fi
          fi
          python3 - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path

          inbox = Path('.')
          temporary = Path(os.environ['RUNNER_TEMP']) / 'agenda-sign'
          temporary.mkdir(mode=0o700)

          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              name = os.environ.get('UPDATE_FILE', '').strip()
              if not name or Path(name).name != name or '\\' in name or any(ord(c) < 32 for c in name):
                  raise SystemExit('Informe somente o nome do arquivo .agenda.json.')
              candidates = [inbox / name]
          elif os.environ['BEFORE'] == '0' * 40:
              candidates = sorted(inbox.glob('*.agenda.json'))
          else:
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--diff-filter=AM', '--no-renames', '-z',
                  os.environ['BEFORE'], 'HEAD', '--', str(inbox)
              ]).split(b'\0')
              candidates = [Path(os.fsdecode(path)) for path in paths if path]

          files = []
          for source in candidates:
              if source.parent != inbox or not source.name.endswith('.agenda.json'):
                  continue
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f'Arquivo inválido ou ausente: {source.name}')
              if source.stat().st_size > 24 * 1024 * 1024:
                  raise SystemExit(f'Arquivo acima de 24 MiB: {source.name}')
              files.append(source.as_posix())
          if not files:
              if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
                  raise SystemExit('Informe um arquivo .agenda.json da pasta principal.')
              print('Nenhum pacote novo ou alterado.')
              raise SystemExit(0)

          with zipfile.ZipFile('AgendaPersonal_AndroidStudio_v1.65_contas_convites.zip') as archive:
              for name in ('sign_update.cjs', 'SignAgendaUpdate.java'):
                  matches = [path for path in archive.namelist() if path.endswith('/tools/' + name)]
                  if len(matches) != 1:
                      raise SystemExit(f'Ferramenta de assinatura ausente ou ambígua: {name}')
                  (temporary / name).write_bytes(archive.read(matches[0]))
          (temporary / 'files.json').write_text(json.dumps(files), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('assinar=true\n')
          PY
      - name: Assinar e verificar com a chave oficial
        if: steps.entrada.outputs.assinar == 'true'
        env:
          AGENDA_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/agenda-sign"
          export ANDROID_KEYSTORE_PATH="$dir/release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$AGENDA_KEYSTORE"
          printf '%s' "$AGENDA_KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset AGENDA_KEYSTORE
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file "$dir/release.der"
          mkdir signed-updates
          node - "$dir" <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const {verify, X509Certificate} = require('node:crypto');

          const directory = process.argv[2];
          const signer = path.join(directory, 'sign_update.cjs');
          const {packageDigest} = require(signer);
          const files = JSON.parse(fs.readFileSync(path.join(directory, 'files.json'), 'utf8'));
          const certificate = new X509Certificate(fs.readFileSync(path.join(directory, 'release.der')));
          for (const source of files) {
            const name = path.basename(source, '.agenda.json');
            const target = path.join('signed-updates', name + '-Assinado.agenda.json');
            const result = spawnSync(process.execPath, [signer, source, target], {stdio: 'inherit'});
            if (result.status !== 0) throw Error('Falha ao assinar ' + path.basename(source));
            const signed = JSON.parse(fs.readFileSync(target, 'utf8'));
            const original = JSON.parse(fs.readFileSync(source, 'utf8'));
            if (!packageDigest(signed).equals(packageDigest(original)) ||
                !verify('sha256', packageDigest(signed), certificate.publicKey, Buffer.from(signed.agendaSignature, 'base64'))) {
              throw Error('A conferência da assinatura ou do conteúdo falhou.');
            }
            console.log('Assinado e conferido: ' + path.basename(target));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: steps.entrada.outputs.assinar == 'true'
        with:
          name: AgendaPersonal-Atualizacoes-Assinadas
          path: signed-updates/*.agenda.json
          if-no-files-found: error

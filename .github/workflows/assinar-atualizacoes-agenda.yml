name: Assinar atualizações do Agenda Personal

on:
  push:
    branches: [main]
    paths:
      - '*.agenda.json'
  workflow_dispatch:
    inputs:
      arquivo:
        description: Nome do arquivo .agenda.json na pasta principal do repositório
        required: true
        type: string

permissions:
  contents: read

jobs:
  assinar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      assinar: ${{ steps.entrada.outputs.assinar }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Selecionar arquivos da atualização
        id: entrada
        env:
          BEFORE: ${{ github.event.before }}
          UPDATE_FILE: ${{ inputs.arquivo }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "$BEFORE^{commit}"; then
              git fetch --no-tags --depth=1 origin "$BEFORE"
            fi
          fi
          python3 - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path

          inbox = Path('.')
          temporary = Path(os.environ['RUNNER_TEMP']) / 'agenda-sign'
          temporary.mkdir(mode=0o700)

          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              name = os.environ.get('UPDATE_FILE', '').strip()
              if not name or Path(name).name != name or '\\' in name or any(ord(c) < 32 for c in name):
                  raise SystemExit('Informe somente o nome do arquivo .agenda.json.')
              candidates = [inbox / name]
          elif os.environ['BEFORE'] == '0' * 40:
              candidates = sorted(inbox.glob('*.agenda.json'))
          else:
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--diff-filter=AM', '--no-renames', '-z',
                  os.environ['BEFORE'], 'HEAD', '--', str(inbox)
              ]).split(b'\0')
              candidates = [Path(os.fsdecode(path)) for path in paths if path]

          files = []
          for source in candidates:
              if source.parent != inbox or not source.name.endswith('.agenda.json'):
                  continue
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f'Arquivo inválido ou ausente: {source.name}')
              if source.stat().st_size > 24 * 1024 * 1024:
                  raise SystemExit(f'Arquivo acima de 24 MiB: {source.name}')
              files.append(source.as_posix())
          if not files:
              if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
                  raise SystemExit('Informe um arquivo .agenda.json da pasta principal.')
              print('Nenhum pacote novo ou alterado.')
              raise SystemExit(0)

          with zipfile.ZipFile('AgendaPersonal_AndroidStudio_v1.65_contas_convites.zip') as archive:
              for name in ('sign_update.cjs', 'SignAgendaUpdate.java'):
                  matches = [path for path in archive.namelist() if path.endswith('/tools/' + name)]
                  if len(matches) != 1:
                      raise SystemExit(f'Ferramenta de assinatura ausente ou ambígua: {name}')
                  (temporary / name).write_bytes(archive.read(matches[0]))
          (temporary / 'files.json').write_text(json.dumps(files), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('assinar=true\n')
          PY
      - name: Conferir regressão antes de assinar
        # Reprova (e nada é assinado) se o arquivo for um pacote completo anterior à referência, remover ou reverter um bloco, mudar
        # o bloco de uma correção protegida (01/02/03, complemento etc.) sem autorização, quebrar a paridade aluno/professor ou for
        # uma correção em conflito; e roda o teste com o mecanismo real do app. Só lê arquivos; não usa a chave. Regras: CLAUDE.md.
        if: steps.entrada.outputs.assinar == 'true'
        run: |
          set -euo pipefail
          mapfile -t arquivos < <(node -e "for (const f of JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))) console.log(f)" "$RUNNER_TEMP/agenda-sign/files.json")
          bash equipe/testes/regressao/conferir-antes-de-assinar.sh "${arquivos[@]}"
      - name: Assinar e verificar com a chave oficial
        if: steps.entrada.outputs.assinar == 'true'
        env:
          AGENDA_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/agenda-sign"
          export ANDROID_KEYSTORE_PATH="$dir/release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$AGENDA_KEYSTORE"
          printf '%s' "$AGENDA_KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset AGENDA_KEYSTORE
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file "$dir/release.der"
          mkdir signed-updates
          node - "$dir" <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const {verify, X509Certificate} = require('node:crypto');

          const directory = process.argv[2];
          const signer = path.join(directory, 'sign_update.cjs');
          const {packageDigest} = require(signer);
          const files = JSON.parse(fs.readFileSync(path.join(directory, 'files.json'), 'utf8'));
          const certificate = new X509Certificate(fs.readFileSync(path.join(directory, 'release.der')));
          for (const source of files) {
            const name = path.basename(source, '.agenda.json');
            const target = path.join('signed-updates', name + '-Assinado.agenda.json');
            const result = spawnSync(process.execPath, [signer, source, target], {stdio: 'inherit'});
            if (result.status !== 0) throw Error('Falha ao assinar ' + path.basename(source));
            const signed = JSON.parse(fs.readFileSync(target, 'utf8'));
            const original = JSON.parse(fs.readFileSync(source, 'utf8'));
            if (!packageDigest(signed).equals(packageDigest(original)) ||
                !verify('sha256', packageDigest(signed), certificate.publicKey, Buffer.from(signed.agendaSignature, 'base64'))) {
              throw Error('A conferência da assinatura ou do conteúdo falhou.');
            }
            console.log('Assinado e conferido: ' + path.basename(target));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: steps.entrada.outputs.assinar == 'true'
        with:
          name: AgendaPersonal-Atualizacoes-Assinadas
          path: signed-updates/*.agenda.json
          if-no-files-found: error

  # Link direto para o Tiago baixar o arquivo assinado no celular (sem ZIP). Job separado: não tem acesso à chave, só recebe o
  # resultado já assinado e conferido do job "assinar". Cria um PRÉ-LANÇAMENTO (prerelease, nunca "latest"): o botão Android do site
  # e do app lê apenas releases/latest com tag android-*, então nada muda para eles. Não publica para os alunos: a publicação continua
  # sendo feita pelo Tiago na Central de atualizações, depois de instalar e testar.
  link-direto:
    needs: assinar
    if: needs.assinar.outputs.assinar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: agenda-link-direto
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AgendaPersonal-Atualizacoes-Assinadas
          path: assinados
      - name: Criar o link direto (pré-lançamento)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          arquivos=(assinados/*-Assinado.agenda.json)
          (( ${#arquivos[@]} > 0 )) || { echo 'Nenhum arquivo assinado recebido.'; exit 1; }
          python3 - "${arquivos[@]}" > notas.md <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          print('Arquivo assinado e conferido pelo fluxo "Assinar atualizações do Agenda Personal".\n')
          for nome in sys.argv[1:]:
              caminho = Path(nome)
              dados = json.loads(caminho.read_text(encoding='utf-8'))
              versao = dados.get('version') or dados.get('id') or '?'
              seq = dados.get('sequence')
              sha = hashlib.sha256(caminho.read_bytes()).hexdigest()
              print(f'- **{caminho.name}** — versão {versao}' + (f' · sequência {seq}' if seq is not None else '') + f'\n  SHA-256: `{sha}`')
          print('\nComo usar: baixe o arquivo neste celular, abra o Agenda → Central de atualizações → Importar. '
                'Teste no seu aparelho antes de publicar para os alunos.\n\n'
                'Isto é um pré-lançamento: não publica para os alunos e não muda o botão de atualizar o APK.')
          PY
          tag="conteudo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          primeiro=$(basename "${arquivos[0]}" -Assinado.agenda.json)
          titulo="Assinado: ${primeiro}"
          (( ${#arquivos[@]} > 1 )) && titulo="${titulo} (+$(( ${#arquivos[@]} - 1 )))"
          gh release create "$tag" "${arquivos[@]}" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$titulo" --notes-file notas.md
          # Trava de segurança: o "latest" tem de continuar sendo o APK (o site e o app dependem disso).
          ultimo=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [[ "$ultimo" != android-* ]]; then
            echo "O 'latest' virou $ultimo; removendo o pré-lançamento para não afetar o botão Android."
            gh release delete "$tag" --yes --cleanup-tag
            exit 1
          fi
          {
            echo '## Link direto do arquivo assinado'
            for f in "${arquivos[@]}"; do
              n=$(basename "$f")
              echo "- [$n](https://github.com/$GH_REPO/releases/download/$tag/$n)"
            done
            echo
            echo "Página: https://github.com/$GH_REPO/releases/tag/$tag"
          } >> "$GITHUB_STEP_SUMMARY"

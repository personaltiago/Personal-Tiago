name: Testar regras do Firestore (mural)

# Roda a suíte de regras do mural no emulador do Firestore, nos servidores do GitHub.
# Somente leitura: não usa segredos, não publica nada e não altera o repositório.
on:
  push:
    branches: [claude/testar-regras-mural, claude/mural-limite-diario]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testar-regras-firestore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regras-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar ferramentas de teste
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fb"
          printf '%s\n' '{"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}' > "$RUNNER_TEMP/fb/firebase.json"
          npm install --prefix "$RUNNER_TEMP/fb" --no-save --no-audit --no-fund firebase@12 @firebase/rules-unit-testing@5 firebase-tools@15
          node --version
          java -version 2>&1 | head -1
          "$RUNNER_TEMP/fb/node_modules/.bin/firebase" --version
      - name: Rodar a suíte no emulador
        env:
          NODE_PATH: ${{ runner.temp }}/fb/node_modules
          FIREBASE_TOOLS_DISABLE_UPDATE_CHECK: 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/fb/node_modules/.bin/firebase" emulators:exec \
            --config "$RUNNER_TEMP/fb/firebase.json" --only firestore --project demo-agenda-mural \
            "node --test --test-concurrency=1 --test-reporter=spec equipe/testes/mural-firestore.test.cjs equipe/testes/mural-regras-reais.test.cjs" 2>&1 | tee "$RUNNER_TEMP/saida.txt"
      - name: Resumo da execução
        if: always()
        run: |
          {
            echo '## Regras do Firestore (mural)'
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/saida.txt" 2>/dev/null || echo 'sem saída'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

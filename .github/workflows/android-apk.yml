name: Gerar APK Agenda Personal

on:
  workflow_dispatch:
  push:
    paths:
      - 'AgendaPersonal_AndroidStudio.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar chave de assinatura
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/agenda-personal-release.jks"
          test -s "$RUNNER_TEMP/agenda-personal-release.jks"

      - name: Extrair projeto Android
        shell: bash
        run: |
          test -f AgendaPersonal_AndroidStudio.zip
          rm -rf android
          mkdir -p android
          unzip -q AgendaPersonal_AndroidStudio.zip -d android
          PROJECT_DIR=$(dirname "$(find android -name settings.gradle -print -quit)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gerar APK assinado
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/agenda-personal-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          export ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/AgendaPersonal.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Pessoal-APK
          path: AgendaPersonal.apk
          if-no-files-found: error

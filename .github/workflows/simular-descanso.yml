name: Simular descanso na tela bloqueada

# Roda sozinho quando a pasta simulacao/ muda (ou pelo botão Run workflow).
# Compila o ZIP atual em modo de teste, liga um Android de mentira, inicia um descanso,
# bloqueia a tela e guarda prints e relatório em simulacao/resultado/. Não publica APK.
on:
  push:
    branches: [main]
    paths:
      - 'simulacao/*.java'
      - 'simulacao/*.sh'
      - 'simulacao/rodar-agora.txt'
      - '.github/workflows/simular-descanso.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-simulacao
  cancel-in-progress: true

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair o projeto e acrescentar a simulação (só nesta máquina)
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/agenda"; mkdir -p "$T"
          unzip -q AgendaPersonal_AndroidStudio_v1.65_contas_convites.zip -d "$T"
          P="$(dirname "$(find "$T" -name settings.gradle | head -1)")"
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
          D="$P/app/src/androidTest/java/com/tiagolima/agendapersonal"; mkdir -p "$D"
          cp simulacao/LockScreenRestSimulation.java "$D/"
          cat >> "$P/app/build.gradle" <<'GRADLE'

          android { defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' } }
          dependencies {
              androidTestImplementation 'androidx.test:runner:1.6.2'
              androidTestImplementation 'androidx.test:core:1.6.1'
              androidTestImplementation 'androidx.test.ext:junit:1.2.1'
              androidTestImplementation 'junit:junit:4.13.2'
          }
          GRADLE
      - name: Compilar o app e a simulação
        shell: bash
        run: |
          set -o pipefail
          mkdir -p simulacao/resultado
          cd "$PROJECT_DIR"
          if gradle :app:assembleDebug :app:assembleDebugAndroidTest --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/simulacao/resultado/compilacao.txt"; then
            echo "APP_APK=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "TEST_APK=$PROJECT_DIR/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" >> "$GITHUB_ENV"
            echo "COMPILOU=sim" >> "$GITHUB_ENV"
          else
            echo "COMPILOU=nao" >> "$GITHUB_ENV"
            tail -150 "$GITHUB_WORKSPACE/simulacao/resultado/compilacao.txt" > "$GITHUB_WORKSPACE/simulacao/resultado/ERRO-compilacao.txt"
          fi
      - name: Ativar emulador
        if: env.COMPILOU == 'sim'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar a simulação no Android 14
        if: env.COMPILOU == 'sim'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash simulacao/rodar.sh
      - name: Guardar o resultado no repositório
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -f simulacao/resultado/compilacao.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ execução $GITHUB_RUN_ID" > simulacao/resultado/quando.txt
          git config user.name "simulacao-agenda"
          git config user.email "simulacao-agenda@users.noreply.github.com"
          git add -A simulacao/resultado
          git commit -m "Resultado da simulação do descanso ($GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

name: Compilar APK de teste (sem publicar)

# Compila o projeto Android do ZIP oficial com o SDK real, roda todos os testes do próprio ZIP e guarda um APK de TESTE.
# Não usa a chave de assinatura, não cria Release e não publica nada. O APK de teste sai com a chave de depuração do GitHub:
# NÃO instala por cima do app do Tiago e não serve para distribuir. O APK oficial continua só em "Gerar e publicar APK Agenda Personal".
on:
  pull_request:
    paths:
      - 'AgendaPersonal_AndroidStudio_v1.65_contas_convites.zip'
      - '.github/workflows/compilar-apk-teste.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilar-apk-teste-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair o projeto do ZIP oficial
        shell: bash
        run: |
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import Path
          source = Path('AgendaPersonal_AndroidStudio_v1.65_contas_convites.zip')
          target = Path(os.environ['RUNNER_TEMP']) / 'agenda-project'
          target.mkdir()
          with zipfile.ZipFile(source) as archive:
              for item in archive.infolist():
                  path = target / item.filename
                  if not path.resolve().is_relative_to(target.resolve()) or stat.S_ISLNK(item.external_attr >> 16):
                      raise RuntimeError('Caminho inválido no ZIP.')
              archive.extractall(target)
          projects = list(target.rglob('settings.gradle'))
          if len(projects) != 1:
              raise RuntimeError('O ZIP precisa conter um único projeto Android.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PROJECT_DIR=' + str(projects[0].parent) + '\n')
          PY
      - name: Testes do próprio ZIP (inclui a barra de progresso)
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python3 tests/run_all.py
      - name: Compilar com o SDK Android real (depuração, sem a chave oficial)
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          unset ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          gradle :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt" dump badging "$apk" | head -1
          cp "$apk" "$GITHUB_WORKSPACE/AgendaPersonal-TESTE-nao-instalar.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: APK-de-TESTE-nao-instalar
          path: AgendaPersonal-TESTE-nao-instalar.apk
          retention-days: 7

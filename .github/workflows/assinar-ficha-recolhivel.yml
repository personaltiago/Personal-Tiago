      - name: Assinar e verificar a correção do professor
        env:
          AGENDA_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/agenda-sign"
          export ANDROID_KEYSTORE_PATH="$dir/release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$AGENDA_KEYSTORE"
          printf '%s' "$AGENDA_KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          mkdir signed-update
          node "$dir/sign_update.cjs" .agenda/ficha-recolhivel.agenda.json signed-update/AgendaPersonal-Professor-Ficha-Recolhivel-Assinado.agenda.json
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file "$dir/release.der"
          node - "$dir" <<'JS'
          const {verify, X509Certificate} = require('node:crypto');
          const fs = require('node:fs');
          const dir = process.argv[2];
          const {packageDigest} = require(dir + '/sign_update.cjs');
          const update = JSON.parse(fs.readFileSync('signed-update/AgendaPersonal-Professor-Ficha-Recolhivel-Assinado.agenda.json', 'utf8'));
          const original = JSON.parse(fs.readFileSync('.agenda/ficha-recolhivel.agenda.json', 'utf8'));
          const certificate = new X509Certificate(fs.readFileSync(dir + '/release.der'));
          if (!packageDigest(update).equals(packageDigest(original)) ||
              !verify('sha256', packageDigest(update), certificate.publicKey, Buffer.from(update.agendaSignature, 'base64')))
            throw Error('Assinatura ou conteúdo divergente.');
          fs.writeFileSync('signed-update/certificado-publico.der', certificate.raw);
          console.log('Pacote assinado e validado com o certificado Android da versão de produção.');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: AgendaPersonal-Ficha-Recolhivel-Assinado
          path: signed-update/
          if-no-files-found: error

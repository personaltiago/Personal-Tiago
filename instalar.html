  padding:13px 16px;
  border:1px solid #8d65a6;
  border-radius:15px;
  background:rgba(14,11,20,.9);
  color:#fff;
  text-decoration:none;
  text-align:left;
}

.choice.android{
  border-color:#792fba;
  background:linear-gradient(110deg,#55118b,#41106e);
}

.symbol{

  min-height:36px;
  margin-right:14px;
  padding-right:13px;
  border-right:1px solid rgba(255,255,255,.3);

.symbol svg{

  height:29px;
  fill:currentColor;
}

.label{

}

.choice strong{
  display:block;
  font-size:clamp(14px,4.2vw,17px);
  line-height:1.3;
}

.choice small{
  display:block;
  margin-top:4px;
  color:#c9bed3;
  font-size:12px;
  line-height:1.4;
}

.choice:hover{

}

.choice:focus-visible{
  outline:3px solid #fff;
  outline-offset:4px;
}

  font-size:12px;
  line-height:1.7;

summary{

  margin:auto;

summary:focus-visible{

details p{

  padding:12px;
  border:1px solid #594166;
